name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('main.py').read()).group(1))")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get LibreHardwareMonitor
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.6 -R LibreHardwareMonitor/LibreHardwareMonitor -p LibreHardwareMonitor.zip -D lhm_download
          python -c "import zipfile,os;z=zipfile.ZipFile('lhm_download/LibreHardwareMonitor.zip');os.makedirs('lib/lhm',exist_ok=True);[open(os.path.join('lib/lhm',os.path.basename(n)),'wb').write(z.read(n)) for n in z.namelist() if n.lower().endswith('.dll')]"
          ls lib/lhm

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --noconsole --name LiteRGB --collect-all libusb_package --collect-all pythonnet --collect-all clr_loader --hidden-import clr --add-data "lib;lib" --add-data "assets;assets" --icon assets/icon.ico main.py

      - name: Self test
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          Start-Process -FilePath dist\LiteRGB.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait
          $result = Get-Content selftest.txt
          Write-Output "Self test: $result"
          if ($result -match '^(missing_lib|missing_pythonnet)') { exit 1 }

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/LiteRGB.exe
          generate_release_notes: true
