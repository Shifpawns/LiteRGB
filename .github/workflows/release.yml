name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version
        shell: bash
        run: |
          version=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('main.py').read()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $version in main.py"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --noconsole --name LiteRGB --collect-all libusb_package --add-data "lib;lib" main.py

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/LiteRGB.exe
          generate_release_notes: true
